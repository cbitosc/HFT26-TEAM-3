# Optional local PostgreSQL. Run from the repository root after creating .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: traceline
      POSTGRES_DB: traceline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the repository-root .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - traceline_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceline -d traceline"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  traceline_postgres:
